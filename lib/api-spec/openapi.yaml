openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: browser
    description: Private remote browser session
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /browser/status:
    get:
      operationId: getBrowserStatus
      tags: [browser]
      summary: Get the current remote browser status
      responses:
        "200":
          description: Current browser connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserStatus"
        "401":
          description: Sign in required
        "403":
          description: Account is not authorized
        "503":
          description: Browser owner account is not configured
  /browser/pairing:
    post:
      operationId: createBrowserPairing
      tags: [browser]
      summary: Create a short-lived code to connect a browser computer
      responses:
        "200":
          description: One-time pairing code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserPairing"
        "401":
          description: Sign in required
        "403":
          description: Account is not authorized
        "503":
          description: Browser owner account is not configured
  /browser/viewer-ticket:
    post:
      operationId: createBrowserViewerTicket
      tags: [browser]
      summary: Create a short-lived ticket for the authenticated browser view
      responses:
        "200":
          description: Browser viewer WebSocket ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserViewerTicket"
        "401":
          description: Sign in required
        "403":
          description: Account is not authorized
        "503":
          description: Browser owner account is not configured
  /browser/session:
    delete:
      operationId: stopBrowserSession
      tags: [browser]
      summary: Stop the current remote browser session
      responses:
        "204":
          description: Browser session stopped
        "401":
          description: Sign in required
        "403":
          description: Account is not authorized
        "503":
          description: Browser owner account is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BrowserStatus:
      type: object
      properties:
        deviceConnected:
          type: boolean
        browserOpen:
          type: boolean
        currentUrl:
          type: ["string", "null"]
        pageTitle:
          type: ["string", "null"]
      required: [deviceConnected, browserOpen, currentUrl, pageTitle]
    BrowserPairing:
      type: object
      properties:
        code:
          type: string
        expiresAt:
          type: string
      required: [code, expiresAt]
    BrowserViewerTicket:
      type: object
      properties:
        ticket:
          type: string
        socketPath:
          type: string
      required: [ticket, socketPath]

